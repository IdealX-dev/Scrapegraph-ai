name: Cost tools preflight
on:
  pull_request:
    paths: ['**.py', '**.pyi', '.codex/cost-tools/**', '.github/workflows/cost-preflight.yml', 'AGENTS.md']
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1'
permissions:
  contents: read
concurrency:
  group: cost-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet ruff==0.16.7 prek==0.5.3
      - name: Test portable guards
        run: python -m unittest discover -s .codex/cost-tools -p "test_*.py"
      - name: Verify kit and changed Python
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            python .codex/cost-tools/preflight.py --base "$BASE"
          else
            python .codex/cost-tools/preflight.py --verify-only
          fi
